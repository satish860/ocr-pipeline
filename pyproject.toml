[project]
name = "ocr-pipeline"
version = "0.2.0"
description = "Simplified OCR pipeline using QwenVL for single-stage document extraction"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "openai>=2.7.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "datasets>=4.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ocr-pipeline = "ocr_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
